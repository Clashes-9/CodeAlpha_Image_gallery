<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aperture — A Lumio Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Floating pill header, echoes the Lumio nav -->
  <header class="topbar">
    <div class="topbar__mark" aria-hidden="true">A</div>
    <span class="topbar__label">Aperture</span>
    <span class="topbar__divider" aria-hidden="true"></span>
    <span class="topbar__count"><span id="visibleCount">16</span> works</span>
  </header>

  <main>
    <!-- Hero -->
    <section class="hero">
      <p class="eyebrow">Generative field studies</p>
      <h1 class="hero__title">A gallery that<br />paints itself.</h1>
      <p class="hero__sub">A collection of photographs organized by mood and place. Explore, filter, and step into any piece.</p>
    </section>

    <!-- Category filters -->
    <nav class="filters" aria-label="Filter gallery by category">
      <button class="chip is-active" data-filter="all">All</button>
      <button class="chip" data-filter="nature">Nature</button>
      <button class="chip" data-filter="architecture">Architecture</button>
      <button class="chip" data-filter="animals">Animals</button>
      <button class="chip" data-filter="travel">Travel</button>
    </nav>

    <!-- Gallery grid -->
    <section class="gallery" id="gallery" aria-label="Image gallery"></section>
  </main>

  <footer class="site-footer">
    <p>Aperture — built as a study in generative color for the Lumio design language.</p>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <div class="lightbox__scrim" data-close></div>

    <button class="lb-btn lb-btn--close" id="lbClose" aria-label="Close viewer">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M1 1L17 17M17 1L1 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <button class="lb-btn lb-btn--prev" id="lbPrev" aria-label="Previous image">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <figure class="lightbox__stage">
      <div class="lightbox__art" id="lbArt"></div>
      <figcaption class="lightbox__caption">
        <span class="lightbox__tag" id="lbTag">Nature</span>
        <span class="lightbox__title" id="lbTitle">Title</span>
        <span class="lightbox__count" id="lbCount">1 / 16</span>
      </figcaption>
    </figure>

    <button class="lb-btn lb-btn--next" id="lbNext" aria-label="Next image">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M7.5 4L13.5 10L7.5 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
